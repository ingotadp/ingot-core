name: "Terraform Lint and Validate"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-gate:
    name: "IngotADP Security Gate"
    uses: ingotadp/ingot-secure/.github/workflows/reusable-security-gate.yml@9e210d8c0a35966d24803e6799083ce5dd4ffb95
    with:
      run-iac-scan: true

  fmt:
    name: "Check Formatting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

  validate:
    name: "Validate Modules and Environments"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.0"

      - name: Validate state-bucket Module
        run: |
          terraform -chdir=modules/state-bucket init -backend=false
          terraform -chdir=modules/state-bucket validate

      - name: Validate workload-identity Module
        run: |
          terraform -chdir=modules/workload-identity init -backend=false
          terraform -chdir=modules/workload-identity validate

      - name: Validate bootstrap Root
        run: |
          terraform -chdir=environments/bootstrap init -backend=false
          terraform -chdir=environments/bootstrap validate

name: "Terraform Speculative Plan"

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    name: "Speculative Plan (Bootstrap)"
    runs-on: ubuntu-latest
    env:
      TF_VAR_project_id: "ingotadp-core"
      TF_VAR_region: "europe-west2"
      TF_VAR_storage_bucket_name: "ingotadp-tfstate-europe-west2"
      TF_VAR_github_org: "ingotadp"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/76811299324/locations/global/workloadIdentityPools/ingot-github-pool/providers/ingot-github-provider"
          service_account: "ingot-gha-runner@ingotadp-core.iam.gserviceaccount.com"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform -chdir=environments/bootstrap init

      - name: Terraform Plan
        run: terraform -chdir=environments/bootstrap plan -no-color
